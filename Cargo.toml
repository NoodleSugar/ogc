[package]
name = "ogc"
edition = "2024"

[dependencies]
tokio = { version = "1.50.0", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["query"] }

serde = { version = "1.0.228", default-features = false, features = [
	"serde_derive",
] }
quick-xml = { version = "0.39.2", default-features = false, features = [
	"serialize",
	"overlapped-lists",
] }
itertools = { version = "0.14.0", default-features = false }

thiserror = { version = "2.0.18", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["from", "into"] }

[dev-dependencies]
tokio = { version = "1.50.0", default-features = false, features = ["macros"] }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "default-tls"] }
